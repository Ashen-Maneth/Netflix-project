# -------------------------
# BUILD -> SCAN -> PUSH
# -------------------------
build_scan_push_image:
  stage: Build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    # 1. Log into Docker Hub
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    # 2. Install Trivy into this temporary Docker container
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    # Step 1: Build the image
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
    
    # Step 2: Scan the image BEFORE pushing
    # (--exit-code 1 means if it finds High/Critical bugs, it stops and FAILS the pipeline right here)
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $IMAGE_NAME:latest
    
    # Step 3: If the scan above passes safely, push to Docker Hub!
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest



    # -------------------------
# AUTO-UPDATE GITOPS REPO
# -------------------------
update_gitops_repo:
  stage: Update_Manifest
  image:
    name: alpine/git
    entrypoint: [""]
  script:
    - 'sed -i "s/tag: .*/tag: $CI_PIPELINE_IID/g" netflix-chart/values.yaml'
    - git config user.email "gitlab-bot@example.com"
    - git config user.name "GitLab CI Bot"
    - git add netflix-chart/values.yaml
    - git commit -m "Auto-update image tag to $CI_PIPELINE_IID [skip ci]"
    - git remote set-url origin https://oauth2:$GITLAB_TOKEN@gitlab.com/Ashen-Maneth/Netflix-project.git
    - git push origin HEAD:main




# -------------------------
# CLEANUP OLD DOCKER IMAGES
# -------------------------
clean_docker_hub:
  stage: Cleanup
  image: alpine:latest
  before_script:
    # Install curl to make API requests and jq to parse the JSON responses
    - apk add --no-cache curl jq
  script:
    - echo "Cleaning up old Docker images in Docker Hub..."
    
    # Step 1: Log in to Docker Hub API to get an authentication token
    - >
      TOKEN=$(curl -s -H "Content-Type: application/json" -X POST 
      -d '{"username": "'${DOCKER_USERNAME}'", "password": "'${DOCKER_PASSWORD}'"}' 
      https://hub.docker.com/v2/users/login | jq -r .token)

    # Step 2: Fetch all tags, sort by date (newest first), remove 'latest', and keep only the top 2
    - >
      TAGS_TO_DELETE=$(curl -s -H "Authorization: JWT ${TOKEN}" 
      "https://hub.docker.com/v2/namespaces/${DOCKER_USERNAME}/repositories/netflix-clone/tags/?page_size=100" 
      | jq -r '.results | sort_by(.last_updated) | reverse | .[].name' 
      | grep -v "latest" | tail -n +3)

    # Step 3: Loop through the old tags and send the DELETE request to Docker Hub
    - |
      if [ -z "$TAGS_TO_DELETE" ]; then
        echo "No old images to delete. Keeping the latest 2."
      else
        for TAG in $TAGS_TO_DELETE; do
          echo "Deleting tag: $TAG"
          curl -s -X DELETE -H "Authorization: JWT ${TOKEN}" "https://hub.docker.com/v2/namespaces/${DOCKER_USERNAME}/repositories/netflix-clone/tags/$TAG"
        done
        echo "Cleanup complete!"
      fi



















