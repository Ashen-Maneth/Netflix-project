stages:
  - Unit_Tests
  - Code_Analysis
  - Dependency_Scan
  - Build
  - Update_Manifest
  - Cleanup
  # - Deploy
  # - Dynamic_Scan

variables:
  IMAGE_NAME: $DOCKER_USERNAME/netflix-clone
  IMAGE_TAG: $CI_PIPELINE_IID
  STAGING_URL: "http://13.60.217.236:3000"

# -------------------------
# UNIT TESTS
# -------------------------
Unit_Tests:
  stage: Unit_Tests
  image: node:18-alpine
  cache:
    paths:
      - node_modules/
  script:
    - npm install
    - npm test -- --coverage
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week

# -------------------------
# SONARQUBE ANALYSIS
# -------------------------
sonarqube_check:
  stage: Code_Analysis
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
      sonar-scanner
      -Dsonar.projectKey=Ashen-Maneth_Netflix-project
      -Dsonar.organization=ashen-maneth
      -Dsonar.sources=.
      -Dsonar.host.url=https://sonarcloud.io
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
